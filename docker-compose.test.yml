# Infraestructura efímera para pruebas automáticas:
#   docker compose -f docker-compose.test.yml up -d
#   npm run test:prepare && npm test
name: prepa-talleres-test
services:
  postgres-test:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: talleres_test, TZ: UTC }
    command: ["postgres", "-c", "timezone=UTC", "-c", "fsync=off"]
    ports: ["127.0.0.1:5432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
  redis-test:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
